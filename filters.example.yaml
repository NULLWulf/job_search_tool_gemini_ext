# Deterministic pre-filter rules, read by app/filters.py. Edit these lists
# directly as you refine what "in scope" means for you — no code changes
# needed. See app/filters.py's module docstring for how they're applied.

# Unambiguous engineering-role title signals. If the title matches one of
# these, it's kept regardless of exclusion_keywords below — e.g. "Software
# Engineer, Automated Marketing" shouldn't get dropped just because
# "marketing" is also in exclusion_keywords. Keep this list short and
# genuinely unambiguous (don't add anything from title_allow_keywords
# that's also ambiguous, like bare "engineer" or "platform").
priority_title_keywords:
  - "software engineer"
  - "software developer"
  - "developer"
  - "full stack"
  - "fullstack"
  - "full-stack"

# Title must match at least one of these to be considered at all.
title_allow_keywords:
  - "engineer"        # covers Engineer / Engineering Manager / Software Engineering
  - "engineering"
  - "developer"
  - "development"
  - "programmer"
  - "architect"
  - "sre"
  - "site reliability"
  - "devops"
  - "full stack"
  - "fullstack"
  - "full-stack"
  - "backend"
  - "back-end"
  - "back end"
  - "platform"
  - "tech lead"
  - "technical lead"

# Even if the title matched the allowlist above, drop it if it also
# matches one of these — engineering-adjacent titles that aren't a fit.
exclusion_keywords:
  - "accountant"
  - "accounting"
  - "nurse"
  - "nursing"
  - "lawyer"
  - "attorney"
  - "paralegal"
  - "chemist"
  - "chemistry"
  - "electrician"
  - "plumber"
  - "welder"
  - "sales representative"
  - "account executive"
  - "sales engineer"
  - "sales development"
  - "business development representative"
  - "recruiter"
  - "talent acquisition"
  - "talent brand"
  - "warehouse"
  - "forklift"
  - "driver"
  - "cdl"
  - "teacher"
  - "professor"
  - "dentist"
  - "physician"
  - "pharmacist"
  - "mechanical engineer"
  - "electrical engineer"
  - "civil engineer"
  - "chemical engineer"
