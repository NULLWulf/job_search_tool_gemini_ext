  - "compliance"
  - "product marketing"

# EDIT ME FIRST: locations to keep, as regex patterns (case-insensitive)
# matched against the free-text location string each ATS/aggregator
# returns. Ships below as Canada/Alberta-only (the original author's
# search) — replace with your own country/region/cities, or every job
# will get rejected regardless of how good a fit it is. Deliberately does
# NOT allow a bare "Remote" with no country qualifier — some postings say
# "Remote Poland"/"Remote Spain"/"Remote Australia" etc, so an allowlist
# needs an explicit country/region signal instead.
location_allow_patterns:
  - '\bcanada\b'
  - '\balberta\b'
  - ',\s*ab\b'       # "Calgary, AB" / "Edmonton, AB"
  - '\bedmonton\b'
  - '\bcalgary\b'
  - '\bontario\b'
  - '\bvancouver\b'

# EDIT ME FIRST (along with stack_core below): JD stack dealbreakers — if
# the description clearly requires one of these languages/frameworks and
# does NOT also mention anything from stack_core, treat it as a mismatch.
# Ships assuming a Python/JS candidate who wants to exclude
# Java/C#/.NET/etc — if your own stack includes one of these "dealbreaker"
# languages, move it down into stack_core instead, or this will reject
# roles in your own stack. Only runs when a description is
# available. Word-boundary matched to avoid e.g. "java" matching
# "javascript". Deliberately NOT including bare "go" — too ambiguous
# ("go-to-market", "go live", etc.); "golang" below covers it, and most Go
# postings also say "Golang" or "Go (Golang)" somewhere in the JD.
stack_dealbreakers:
  - '\bjava\b'
  - '\bc#\b'
  - '\.net\b'
  - '\bgolang\b'
  - '\bruby\b'
  - '\brails\b'
  - '\bphp\b'
  - '\bkotlin\b'
  - '\bswift\b'
  - '\bscala\b'
  - '\bc\+\+\b'

# Your own core stack — if the JD mentions any of these, a stack dealbreaker
# match above is ignored (the role likely uses both, or the dealbreaker
# keyword is a false positive).
stack_core:
  - '\bpython\b'
  - '\bfastapi\b'
  - '\bdjango\b'
  - '\bflask\b'
  - '\bjavascript\b'
  - '\btypescript\b'
  - '\breact\b'
  - '\bnode(?:\.?js)?\b'

# Below this many characters, a JD is treated as a short aggregator teaser
# snippet rather than a full posting (see app/filters.py's looks_truncated).
truncated_description_min_chars: 400
