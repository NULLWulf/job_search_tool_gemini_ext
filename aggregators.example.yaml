# Broad-coverage job aggregators (as opposed to companies.yaml, which is
# one board per company). These search across many employers at once using
# keyword + location, so they catch companies you haven't identified yet —
# at the cost of more noise, which is exactly what filters.py exists for.
#
# type: one of "adzuna" | "remotive"
# params: passed straight through to that aggregator's search API, EXCEPT
#   max_pages (adzuna only) — a pipeline-level control consumed by
#   fetch_adzuna() before building the request, not sent to Adzuna itself.
#
# EDIT ME: every Adzuna entry's `where` below is Alberta/Canada (the
# original author's search) and `what` targets their keywords/stack.
# Replace both with your own location and role keywords — and make sure
# they match filters.yaml's location_allow_patterns/stack_core, or a real
# result will still get filtered out downstream.

aggregators:
  - name: Adzuna (Canada, software engineer)
    type: adzuna
    params:
      what: "software engineer"
      where: "Alberta"
      results_per_page: 50
      max_pages: 5   # up to 250 results; stops early if a page comes back short
    notes: >
      Requires free app_id/app_key from https://developer.adzuna.com (instant
      signup, no approval wait per their docs — exact rate limit wasn't
      confirmed in research, check your account dashboard after signup).
      Set ADZUNA_APP_ID / ADZUNA_APP_KEY as environment variables.

  - name: Adzuna (Canada, remote backend/fullstack)
    type: adzuna
    params:
      what: "backend engineer OR full stack"
      where: "Canada"
      results_per_page: 50
      max_pages: 5

  - name: Adzuna (Canada, remote senior software engineer)
    type: adzuna
    params:
      what: "software engineer"
      where: "Canada"
      results_per_page: 50
      max_pages: 1

  - name: Remotive (software-dev category)
    type: remotive
    params:
      category: "software-dev"
    notes: >
      No auth needed. Remote-only listings (won't catch Alberta on-site
      roles). Remotive asks for max 4 requests/day and max 2/minute — keep
      this to one call per pipeline run. Listings are delayed 24h from
      posting per their terms.
